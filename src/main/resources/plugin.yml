name: PorticleGun
version: '${project.version}'
main: eu.nurkert.porticlegun.PorticleGun
api-version: '1.21'
authors: [ nurkert ]
softdepend: [WorldGuard, Multiverse-Core, floodgate]
# installs the Bedrock pack before Geyser reads its packs folder
loadbefore: [Geyser-Spigot]

commands:
  porticlegun:
    description: Opens the menu with every PorticleGun item, or manages guns
    aliases: [pg]
    usage: /<command> [give|removeportal|list|remove|clearplayer|reload]
    permission: porticlegun.command
    tab-completer: eu.nurkert.porticlegun.commands.PorticleGunCommand

permissions:
  porticlegun.command:
    description: Allows using /porticlegun to obtain a gun
    default: true
  porticlegun.interdimensional:
    description: Allows crafting and using the interdimensional gun
    default: true
  porticlegun.admin:
    description: Allows administrative PorticleGun management commands
    default: op
