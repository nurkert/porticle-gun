# 3D model of the gun for Java players (resource pack, needs Minecraft 1.21.4+ clients).
# It is sent in addition to the server resource pack and does not replace any vanilla files,
# so it works next to other packs. Players who decline it see a brewing stand.
resource-pack:
  enabled: true
  # true: players have to accept the pack to join
  required: false
  # Leave empty to download the pack from the GitHub release of this plugin version.
  # Set your own URL (and its SHA-1) to host the pack yourself or for development builds.
  url: ""
  sha1: ""
  # optional message shown in the download prompt
  prompt: ""

# Portal status shown while holding the gun.
hud:
  # Two rings around the crosshair in the portal colours (Java players who loaded the resource pack).
  # Players without the pack, and false here, get the classic title.
  overlay: true
  # The same rings for Bedrock players. Off by default until it has been checked on a Bedrock client;
  # see docs/bedrock.md.
  bedrock-overlay: false

# 3D model of the gun for Bedrock players connected through Geyser.
bedrock:
  # Copy the Bedrock pack and the Geyser item mapping into plugins/Geyser-Spigot on startup.
  # If Geyser runs on a proxy, copy porticlegun.mcpack and porticlegun_mappings.json there by hand.
  install-pack: true

# Gravity gun: press the drop key (Q) while holding the gun to pick up / let go of a block or mob.
gravity-gun:
  # false disables the gravity gun completely
  enabled: true
  # whether players can pick up other players
  allow-player-capture: false
  # whether chests can be picked up (their contents travel with them)
  allow-chest-capture: true
  # blocks that cannot be picked up (Bukkit material names)
  block-blacklist:
    - AIR

portal:
  # How far (in blocks) the gun looks for a block to place a portal on.
  # Also the range of /porticlegun removeportal.
  max-target-distance: 128
  # Portals are not placed further away than this from the shooter.
  max-player-distance: 100
  # How many blocks are traced to find out which side of a block was hit.
  max-block-trace: 100
  custom-colors:
    # Default colour palette. Edit the entries to tweak particle, chat, or banner colours
    # or append additional blocks to extend the list. Run "/porticlegun reload" to apply.
    - name: black
      particle-color: "#000000"
      chat-color: BLACK
      banner-dye: BLACK
    - name: dark_blue
      particle-color: "#0000AA"
      chat-color: DARK_BLUE
      banner-dye: BLUE
    - name: dark_green
      particle-color: "#008000"
      chat-color: DARK_GREEN
      banner-dye: GREEN
    - name: dark_aqua
      particle-color: "#00FFFF"
      chat-color: DARK_AQUA
      banner-dye: CYAN
    - name: dark_red
      particle-color: "#FF0000"
      chat-color: DARK_RED
      banner-dye: RED
    - name: dark_purple
      particle-color: "#800080"
      chat-color: DARK_PURPLE
      banner-dye: PURPLE
    - name: gold
      particle-color: "#FFA500"
      chat-color: GOLD
      banner-dye: ORANGE
    - name: dark_gray
      particle-color: "#555555"
      chat-color: DARK_GRAY
      banner-dye: GRAY
    - name: blue
      particle-color: "#0000FF"
      chat-color: BLUE
      banner-dye: LIGHT_BLUE
    - name: green
      particle-color: "#00FF00"
      chat-color: GREEN
      banner-dye: LIME
    - name: aqua
      particle-color: "#008080"
      chat-color: AQUA
      banner-dye: LIGHT_BLUE
    - name: red
      particle-color: "#800000"
      chat-color: RED
      banner-dye: PINK
    - name: light_purple
      particle-color: "#FF00FF"
      chat-color: LIGHT_PURPLE
      banner-dye: MAGENTA
    - name: yellow
      particle-color: "#FFFF00"
      chat-color: YELLOW
      banner-dye: YELLOW
    - name: white
      particle-color: "#FFFFFF"
      chat-color: WHITE
      banner-dye: WHITE
