name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hold the gun
        2. ...
  - type: input
    id: plugin-version
    attributes:
      label: PorticleGun version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and version
      placeholder: Paper 1.21.4
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Java Edition
        - Bedrock (mouse and keyboard)
        - Bedrock (touch)
        - Bedrock (controller)
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: Errors or warnings from the server log
      render: text
