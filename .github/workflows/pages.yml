name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'images/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'scripts/build_wiki.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r images _site/images

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the wiki from the documentation
        run: |
          pip install markdown==3.7
          python3 scripts/build_wiki.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
