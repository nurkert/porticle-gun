name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set version from tag
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B verify

      - name: Smoke test on Paper 1.21.4
        run: scripts/smoke-test.sh "target/PorticleGun-${GITHUB_REF_NAME#v}.jar" 1.21.4

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            target/PorticleGun-*.jar
            target/PorticleGun-resourcepack-*.zip
            target/PorticleGun-bedrock-*.mcpack
            src/main/resourcepack/geyser/porticlegun_mappings.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
