name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # compiles, runs the unit tests and checks formatting (spotless:check)
      - name: Build
        run: mvn -B verify

      - name: Smoke test on Paper 1.21.4
        run: scripts/smoke-test.sh "$(ls target/PorticleGun-*.jar | head -n 1)" 1.21.4

      - name: Smoke test on Paper 1.21.4 with Geyser and Floodgate
        run: scripts/smoke-test.sh "$(ls target/PorticleGun-*.jar | head -n 1)" 1.21.4 geyser

      - uses: actions/upload-artifact@v4
        with:
          name: PorticleGun-${{ github.sha }}
          path: |
            target/PorticleGun-*.jar
            target/PorticleGun-resourcepack-*.zip
            target/PorticleGun-bedrock-*.mcpack
          if-no-files-found: error

  resource-packs:
    name: Resource packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generated files are up to date
        run: |
          python3 scripts/generate_resourcepack.py
          # JSON only: PNG bytes may differ between zlib versions
          git diff --exit-code -- 'src/main/resourcepack/*.json' 'src/main/resourcepack/*.mcmeta'

      - name: Validate the Bedrock pack
        run: |
          pip install jsonschema
          git clone --quiet https://github.com/Blockception/Minecraft-bedrock-json-schemas.git /tmp/schemas
          git -C /tmp/schemas checkout --quiet 473d1aa94be63806a4f38345ad461b5d4e8d8a2a
          python3 scripts/validate_bedrock_pack.py --schemas /tmp/schemas
