name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # compiles, runs the unit tests and checks formatting (spotless:check)
      - name: Build
        run: mvn -B verify

      - name: Smoke test on Paper 1.21.4
        run: scripts/smoke-test.sh "$(ls target/PorticleGun-*.jar | head -n 1)" 1.21.4

      - uses: actions/upload-artifact@v4
        with:
          name: PorticleGun-${{ github.sha }}
          path: target/PorticleGun-*.jar
          if-no-files-found: error
